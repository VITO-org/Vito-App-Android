name: CI - Jira Sync (Push)

on:
  push:
    branches:
      - 'scrum-*'

jobs:
  jira-sync:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make transition script executable
        run: chmod +x scripts/jira-transition.sh

      - name: Extract Jira issue key
        id: extract
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" =~ scrum-([0-9]+) ]]; then
            ISSUE_NUM="${BASH_REMATCH[1]}"
            echo "issue_key=SCRUM-${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
            echo "✅ Extracted issue key: SCRUM-${ISSUE_NUM}"
          else
            echo "⚠️ Branch '$BRANCH' does not match scrum-{number}. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition to In Progress
        if: steps.extract.outputs.skip != 'true'
        run: ./scripts/jira-transition.sh "${{ steps.extract.outputs.issue_key }}" "In Progress"

      - name: Transition to Bugs (any job failed)
        if: steps.extract.outputs.skip != 'true' && (needs.js-lint-test.result == 'failure' || needs.android-build.result == 'failure')
        run: |
          echo "❌ Tests or build failed → Bugs"
          ./scripts/jira-transition.sh "${{ steps.extract.outputs.issue_key }}" "Bugs"

      - name: Fail workflow if any job failed
        if: needs.js-lint-test.result == 'failure' || needs.android-build.result == 'failure'
        run: exit 1

  js-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Unit tests (Jest)
        id: jest
        run: npx jest --passWithNoTests
        continue-on-error: true

  android-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.modified, 'android/') || contains(github.event.head_commit.added, 'android/') || contains(github.event.head_commit.removed, 'android/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' android/gradlew

      - name: Android unit tests
        id: android_test
        run: cd android && ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Build Android (debug)
        id: build
        run: cd android && ./gradlew assembleDebug --no-daemon --parallel --build-cache
        continue-on-error: true

  discord-notify:
    needs: [jira-sync, js-lint-test, android-build]
    runs-on: ubuntu-latest
    if: always() && github.event.head_commit != null
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEATURES_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make discord-notify.sh executable
        run: chmod +x scripts/discord-notify.sh

      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.js-lint-test.result }}" == "failure" ]] || [[ "${{ needs.android-build.result }}" == "failure" ]]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
            echo "build_status=Fallido" >> "$GITHUB_OUTPUT"
            echo "jira_status=Bugs" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
            echo "build_status=Exitoso" >> "$GITHUB_OUTPUT"
            echo "jira_status=In Progress" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FEATURES_WEBHOOK }}
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          FIELDS=$(jq -n \
            --arg author "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "$COMMIT_MSG" \
            --arg link "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg build "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.build_status }}" \
            --arg jira "${{ steps.status.outputs.jira_status }}" \
            '[
              {name: "👤 Autor", value: $author, inline: true},
              {name: "🌿 Rama", value: $branch, inline: true},
              {name: "💬 Commit", value: $commit, inline: false},
              {name: "🔗 Link", value: $link, inline: false},
              {name: "🔨 Build", value: $build, inline: true},
              {name: "📋 Jira", value: $jira, inline: true}
            ]')
          ./scripts/discord-notify.sh \
            "$DISCORD_WEBHOOK" \
            "${{ steps.status.outputs.emoji }} Push a rama ${{ github.ref_name }}" \
            "" \
            "${{ steps.status.outputs.color }}" \
            "$FIELDS"
        continue-on-error: true
