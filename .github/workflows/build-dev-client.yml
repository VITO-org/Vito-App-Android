name: Build Android Dev Client APK

on:
  workflow_dispatch: # Manual
  push:
    branches:
      - dev
      - dev-pruebas
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'

jobs:
  build:
    name: Build Debug APK (Dev Client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Debug: list repo and android dir"
        run: |
          echo "Commit: $(git rev-parse --short HEAD)"
          ls -la .
          ls -la android || true

      - name: Ensure Gradle wrapper exists and is executable
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found - commit the Gradle wrapper or adjust the path."
            exit 1
          fi
          chmod +x android/gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Android Debug APK (con expo-dev-client)
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          # Indica a React Native que es un build de desarrollo
          # El APK incluirá expo-dev-client para conectarse a Metro
          NODE_ENV: development

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitoHealth-DevClient
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
