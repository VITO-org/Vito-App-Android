name: CodeQL SAST

# DoD INTEGRACION-3 — Análisis estático de seguridad (SAST)
# Tool: CodeQL (GitHub nativo, gratuito para repos públicos y privados)
# Lenguaje: javascript-typescript (cubre React Native + TypeScript)
#
# Para migrar a SonarCloud en el futuro (SOLO si el repo es público / tienen licencia gratuita):
#   1. Crear cuenta en sonarcloud.io e importar el repo.
#   2. Agregar secreto SONAR_TOKEN en GitHub Settings → Secrets.
#   3. Agregar step: uses: SonarSource/sonarcloud-github-action@master
#      with: args: >
#        -Dsonar.projectKey=TU_ORG_TU_REPO
#        -Dsonar.organization=TU_ORG
#   4. Reemplazar el badge de CodeQL por el de SonarCloud en README.md.
#   NOTA: SonarCloud es gratuito SOLO para proyectos open source (repos públicos).
#         Para repos privados requiere plan de pago → NO implementar en ese caso.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev
      - main
  # Escaneo semanal para detectar nuevas vulnerabilidades en dependencias existentes
  schedule:
    - cron: '0 8 * * 1'  # Todos los lunes a las 08:00 UTC

jobs:
  codeql-analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # Necesario para subir resultados al Security tab de GitHub

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Queries adicionales de seguridad (más estricto que el default)
          queries: security-extended

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
