name: Deploy panel-admin (Firebase)

# El panel vive en la rama `test`. Cada push que toque el panel se compila
# y se publica en el sitio `vito-panel-admin` de Firebase Hosting.

on:
  push:
    branches: [test]
    paths:
      - 'vito-alert-dashboard/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-panel.yml'
  workflow_dispatch:

# Un solo deploy a la vez: evita que dos pushes se pisen.
concurrency:
  group: deploy-panel-firebase
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fail-fast: sin credenciales el bundle sale roto y el deploy no sirve.
      - name: Verificar credenciales y configuracion
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PROFILES_TABLE: ${{ secrets.VITE_PROFILES_TABLE }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          faltan=()
          [ -n "${VITE_SUPABASE_URL}" ] || faltan+=("VITE_SUPABASE_URL")
          [ -n "${VITE_SUPABASE_ANON_KEY}" ] || faltan+=("VITE_SUPABASE_ANON_KEY")
          [ -n "${VITE_PROFILES_TABLE}" ] || faltan+=("VITE_PROFILES_TABLE")
          [ -n "${PROJECT_ID}" ] || faltan+=("FIREBASE_PROJECT_ID (variable)")
          [ -n "${SERVICE_ACCOUNT}" ] || faltan+=("FIREBASE_SERVICE_ACCOUNT (secret)")
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::error::Faltan: ${faltan[*]}. Configuralos en Settings > Secrets and variables > Actions."
            exit 1
          fi
          test -f firebase.json
          test -f .firebaserc
          echo "Configuracion presente."

      # .env efimero en el runner. Nunca se commitea: el repo ya no lo tiene.
      - name: Generar .env efimero desde secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PROFILES_TABLE: ${{ secrets.VITE_PROFILES_TABLE }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_PROFILES_TABLE=${VITE_PROFILES_TABLE}"
          } > vito-alert-dashboard/.env
          echo ".env efimero generado en el runner (no se commitea)."

      - name: Instalar dependencias
        run: npm ci
        working-directory: vito-alert-dashboard

      - name: Build
        run: npm run build
        working-directory: vito-alert-dashboard

      # Detecta la regresion tipica: que el bundle publicado termine
      # embebiendo una credencial que NO es la del secret configurado
      # (tipico: alguien commitea un .env viejo y Vite lo pisa).
      - name: Verificar credencial embebida en el bundle
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          CRED=$(grep -ohE 'sb_publishable_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{100,}' vito-alert-dashboard/dist/assets/*.js | sort -u || true)
          COUNT=$(printf '%s' "$CRED" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No se encontro ninguna credencial en el bundle: revisa que las variables VITE_ se inyecten."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::El bundle contiene mas de una credencial: hay una key vieja compilada dentro."
            exit 1
          fi
          if [ "$CRED" != "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::El bundle contiene una credencial distinta de la configurada en secrets."
            exit 1
          fi
          echo "OK: el bundle contiene exactamente la credencial de secrets."

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: panel
          channelId: live
