name: Deploy panel-admin a Pages

on:
  push:
    branches: [test]
    paths:
      - 'vito-alert-dashboard/**'
      - '.github/workflows/deploy-panel.yml'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: vito-alert-dashboard
      - run: npm run build
        working-directory: vito-alert-dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PROFILES_TABLE: ${{ secrets.VITE_PROFILES_TABLE }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vito-alert-dashboard/dist
