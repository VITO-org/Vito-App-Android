name: Build Android Preview APK

on:
  workflow_dispatch: # Permite ejecutar la build manualmente desde GitHub
  push:
    branches:
      - main
      - master
      - dev
      - dev-pruebas
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'

jobs:
  build:
    name: Build Release APK (preview)
    runs-on: ubuntu-latest
    env:
      # Variables EXPO_PUBLIC_* → inlineadas en el bundle JS por babel-preset-expo.
      # El bundle va embebido en el APK, así que deben estar presentes en el build.
      EXPO_PUBLIC_CHAT_AUTH_HEADER_NAME: ${{ secrets.EXPO_PUBLIC_CHAT_AUTH_HEADER_NAME }}
      EXPO_PUBLIC_CHAT_AUTH_HEADER_VALUE: ${{ secrets.EXPO_PUBLIC_CHAT_AUTH_HEADER_VALUE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Verificar config del chat (EXPO_PUBLIC_*)
        run: |
          if [ -z "$EXPO_PUBLIC_CHAT_AUTH_HEADER_NAME" ] || [ -z "$EXPO_PUBLIC_CHAT_AUTH_HEADER_VALUE" ]; then
            echo "::warning title=Chat sin credencial::EXPO_PUBLIC_CHAT_AUTH_HEADER_NAME/VALUE no están configurados en Settings → Secrets → Actions. El APK compila, pero el chat va a fallar en runtime."
          fi

      - name: Build Android Release APK (firmado con debug keystore)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitoHealth-Preview
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
