# =============================================================================
# Build Android Preview APK — Vito Health Connect
# =============================================================================
# Build de release APK para testing/preview.
# Corre en GitHub Actions — no necesita la PC del desarrollador.
#
# Trigger manual (workflow_dispatch) o push a branches activos.
# =============================================================================

name: Build Android Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev
      - dev-pruebas
      - 'release/*'
    paths:
      - '.github/workflows/**'
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK (preview)
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo modules
        run: |
          node -e "
            const expo = require('expo/package.json');
            console.log('✓ expo', expo.version);
          "

      - name: Setup release signing (si hay secrets)
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE || '' }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
            echo "✓ Keystore de producción configurado"
          else
            echo "ℹ Usando debug.keystore — no hay secrets de release configurados"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          # Si hay secrets de release configurados, pasarlos al build
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS || '' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS || '' }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitoHealth-Preview
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
