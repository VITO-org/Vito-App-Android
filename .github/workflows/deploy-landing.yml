name: Deploy Landing (Firebase)

# ProducciÃ³n: push a `landing` â†’ canal `live`.
# Previews: pull request hacia `landing` â†’ canal temporal con URL propia.
# La configuraciÃ³n de hosting vive en `firebase.json` (raÃ­z, public: "landing").

on:
  push:
    branches: [landing]
    paths:
      - "landing/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-landing.yml"
  pull_request:
    branches: [landing]
    paths:
      - "landing/**"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy a Firebase Hosting
    runs-on: ubuntu-latest
    # Los PR desde forks no reciben secrets: se omiten en vez de fallar.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail-fast con mensaje claro en vez de un error opaco del CLI.
      - name: Verificar configuraciÃ³n de Firebase
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::Falta la variable de repositorio FIREBASE_PROJECT_ID (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${SERVICE_ACCOUNT}" ]; then
            echo "::error::Falta el secret FIREBASE_SERVICE_ACCOUNT (JSON de la service account)."
            exit 1
          fi
          test -f landing/index.html
          test -f firebase.json
          echo "ConfiguraciÃ³n presente."

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: landing
          channelId: pr-${{ github.event.number }}
          expires: 7d

      - name: Deploy producciÃ³n
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: landing
          channelId: live
