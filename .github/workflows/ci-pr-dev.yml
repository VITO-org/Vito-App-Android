name: CI - Jira Sync (PR to Dev)

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

env:
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make transition script executable
        run: chmod +x scripts/jira-transition.sh

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' android/gradlew

      - name: Extract Jira issue key
        id: extract
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ scrum-([0-9]+) ]]; then
            ISSUE_NUM="${BASH_REMATCH[1]}"
            echo "issue_key=SCRUM-${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
            echo "✅ Extracted issue key: SCRUM-${ISSUE_NUM}"
          else
            echo "⚠️ Branch '$BRANCH' does not match scrum-{number}. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Jest tests
        id: jest
        if: steps.extract.outputs.skip != 'true'
        run: npx jest --passWithNoTests
        continue-on-error: true

      - name: Run Android unit tests
        id: android_test
        if: steps.extract.outputs.skip != 'true'
        run: cd android && ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Build Android (debug)
        id: build
        if: steps.extract.outputs.skip != 'true'
        run: cd android && ./gradlew assembleDebug --no-daemon --parallel --build-cache
        continue-on-error: true

      - name: Transition to Done (all passed)
        if: steps.extract.outputs.skip != 'true' && steps.jest.outcome == 'success' && steps.android_test.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          echo "✅ All tests and build passed → Done"
          ./scripts/jira-transition.sh "${{ steps.extract.outputs.issue_key }}" "Done"

      - name: Transition to Bugs (tests or build failed)
        if: steps.extract.outputs.skip != 'true' && (steps.jest.outcome == 'failure' || steps.android_test.outcome == 'failure' || steps.build.outcome == 'failure')
        run: |
          echo "❌ Tests or build failed → Bugs"
          ./scripts/jira-transition.sh "${{ steps.extract.outputs.issue_key }}" "Bugs"

      - name: Fail workflow if tests or build failed
        if: steps.jest.outcome == 'failure' || steps.android_test.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
