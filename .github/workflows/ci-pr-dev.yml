name: CI - Jira Sync (PR to Dev)

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  jira-sync:
    runs-on: ubuntu-latest
    needs: [js-lint-test, android-build]
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make transition script executable
        run: chmod +x scripts/jira-transition.sh

      - name: Extract Jira issue key
        id: extract
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ scrum-([0-9]+) ]]; then
            ISSUE_NUM="${BASH_REMATCH[1]}"
            echo "issue_key=SCRUM-${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
            echo "✅ Extracted issue key: SCRUM-${ISSUE_NUM}"
          else
            echo "⚠️ Branch '$BRANCH' does not match scrum-{number}. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition to Done (all passed)
        if: steps.extract.outputs.skip != 'true' && needs.js-lint-test.result == 'success' && (needs.android-build.result == 'success' || needs.android-build.result == 'skipped')
        run: |
          echo "✅ All tests and build passed → Done"
          ./scripts/jira-transition.sh "${{ steps.extract.outputs.issue_key }}" "Done"

      - name: Transition to Bugs (any job failed)
        if: steps.extract.outputs.skip != 'true' && (needs.js-lint-test.result == 'failure' || needs.android-build.result == 'failure')
        run: |
          echo "❌ Tests or build failed → Bugs"
          ./scripts/jira-transition.sh "${{ steps.extract.outputs.issue_key }}" "Bugs"

      - name: Fail workflow if any job failed
        if: needs.js-lint-test.result == 'failure' || needs.android-build.result == 'failure'
        run: exit 1

  js-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Unit tests (Jest)
        id: jest
        run: npx jest --passWithNoTests
        continue-on-error: true

  android-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.modified, 'android/') || contains(github.event.head_commit.added, 'android/') || contains(github.event.head_commit.removed, 'android/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' android/gradlew

      - name: Android unit tests
        id: android_test
        run: cd android && ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Build Android (debug)
        id: build
        run: cd android && ./gradlew assembleDebug --no-daemon --parallel --build-cache
        continue-on-error: true

  discord-notify:
    needs: [jira-sync, js-lint-test, android-build]
    runs-on: ubuntu-latest
    if: always()
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make discord-notify.sh executable
        run: chmod +x scripts/discord-notify.sh

      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.js-lint-test.result }}" == "failure" ]] || [[ "${{ needs.android-build.result }}" == "failure" ]]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
            echo "ci_status=Fallido" >> "$GITHUB_OUTPUT"
            echo "jira_status=Bugs" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
            echo "ci_status=Exitoso" >> "$GITHUB_OUTPUT"
            echo "jira_status=Done" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PR }}
        run: |
          FIELDS=$(jq -n \
            --arg pr "${{ github.event.pull_request.title }}" \
            --arg pr_link "${{ github.event.pull_request.html_url }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg branch "${{ github.head_ref }} → ${{ github.base_ref }}" \
            --arg ci "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.ci_status }}" \
            --arg jira "${{ steps.status.outputs.jira_status }}" \
            '[
              {name: "📄 PR", value: ($pr + "\n" + $pr_link), inline: false},
              {name: "👤 Autor", value: $author, inline: true},
              {name: "🔀 Branch", value: $branch, inline: true},
              {name: "✅ CI", value: $ci, inline: true},
              {name: "📋 Jira", value: $jira, inline: true}
            ]')
          ./scripts/discord-notify.sh \
            "$DISCORD_WEBHOOK" \
            "${{ steps.status.outputs.emoji }} Pull Request a ${{ github.base_ref }}" \
            "" \
            "${{ steps.status.outputs.color }}" \
            "$FIELDS"
        continue-on-error: true
